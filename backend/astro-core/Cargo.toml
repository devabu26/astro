[package]
name = "astro-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "astro_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
matrix-sdk = "=0.19.1"
matrix-sdk-ui = "=0.19.1"
matrix-sdk-sqlite = { version = "=0.19.1", features = ["bundled"] }
matrix-sdk-store-encryption = "=0.19.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros"] }